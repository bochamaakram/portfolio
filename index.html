<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1b26" />
    <link rel="icon" href="/brand/akram-mark.svg" type="image/svg+xml" data-theme-icon />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preload" href="/brand/akram-mark.svg" as="image" type="image/svg+xml" />
    <script>
      (function(){try{var t=localStorage.getItem("omarchy-site-theme");var ok=["tokyo-night","catppuccin-mocha","catppuccin-macchiato","catppuccin-frappe","catppuccin-latte","gruvbox-dark","gruvbox-light","nord","rose-pine","rose-pine-moon","rose-pine-dawn","dracula","kanagawa","onedark","palenight","everforest-dark","everforest-light","tokyo-day","tokyo-storm","night-owl","monokai-pro","embark"];var light=["catppuccin-latte","gruvbox-light","rose-pine-dawn","tokyo-day","everforest-light"];var dark=["tokyo-night","catppuccin-mocha","catppuccin-macchiato","catppuccin-frappe","gruvbox-dark","nord","rose-pine","rose-pine-moon","dracula","kanagawa","onedark","palenight","everforest-dark","night-owl","monokai-pro","embark","tokyo-storm"];if(ok.indexOf(t)<0){var pool=window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches?light:dark;t=pool[Math.floor(Math.random()*pool.length)];localStorage.setItem("omarchy-site-theme",t)}document.documentElement.dataset.theme=t}catch(e){document.documentElement.dataset.theme="tokyo-night"}})()
    </script>
    <script>
      (function(){try{if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;var h=document.documentElement;h.classList.add('etch-pending');h.setAttribute('data-etch-held','');setTimeout(function(){h.classList.remove('etch-pending')},5000)}catch(e){}})()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
